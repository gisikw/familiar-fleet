name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Install shells for live pane-launcher tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y zsh fish dash
          else
            brew install fish dash
          fi
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/familiar-fleet
